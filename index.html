<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<script>window.GO_PWA=true</script>
<title>Go-Schule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EDEDEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Go-Schule">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&text=%E7%A2%81&display=swap">
<style>
/* Gestaltung nach Dieter Rams: so wenig Gestaltung wie möglich. Das Brett ist das Objekt, alles andere tritt zurück.
   Eine Signalfarbe (Orange) nur für das, was gerade zählt. Flache, matte Flächen, keine Schatten.
   Raster: alle Abstände, Größen, Radien und Zeilenhöhen sind Vielfache von 8px. Schriftgrößen 12/16/24/32 auf Zeilenhöhen 16/24/32/40. */
:root{
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s7:56px; --s8:64px;
  --r:8px; --r2:16px;
  --bg:#EDEDEA; --surface:#F7F7F5; --raised:#FFFFFF; --key:#E1E1DD; --key-down:#D3D3CE;
  --ink:#1D1D1C; --muted:#6C6C67; --rule:#D5D5D0;
  --accent:#E0531C; --accent-ink:#FFFFFF; --accent-soft:#F7DED2;
  --board:#D8B57A; --grid:#4A3A20; --coord:#6E5734;
  --good:#3A7A4C; --good-soft:#DDEBDF; --warn:#B23A2C; --warn-soft:#F4DEDA;
  --stone-b1:#4E5056; --stone-b2:#141416; --stone-w1:#FFFFFF; --stone-w2:#D8D8D2; --stone-edge:#8E8A78;
  --scrim:rgba(20,20,18,.4);
  --f-mark:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --surface:#1E1E1D; --raised:#262625; --key:#2C2C2A; --key-down:#363633;
    --ink:#ECECE8; --muted:#9C9C96; --rule:#30302E;
    --accent:#F26B2E; --accent-ink:#1A0E08; --accent-soft:#3B2216;
    --board:#B8975F; --grid:#33260F; --coord:#3D2E15;
    --good:#7DC492; --good-soft:#1D2E22; --warn:#F08070; --warn-soft:#3A1F1B;
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --surface:#1E1E1D; --raised:#262625; --key:#2C2C2A; --key-down:#363633;
  --ink:#ECECE8; --muted:#9C9C96; --rule:#30302E;
  --accent:#F26B2E; --accent-ink:#1A0E08; --accent-soft:#3B2216;
  --board:#B8975F; --grid:#33260F; --coord:#3D2E15;
  --good:#7DC492; --good-soft:#1D2E22; --warn:#F08070; --warn-soft:#3A1F1B;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:24px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:576px;margin:0 auto;padding-left:max(var(--s2),env(safe-area-inset-left,0px));padding-right:max(var(--s2),env(safe-area-inset-right,0px));padding-block:var(--s6) calc(var(--s8) + var(--s4));display:flex;flex-direction:column;gap:var(--s3)}

/* Typografie */
h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:32px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:32px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:16px;line-height:24px}
.eyebrow,.lab,.badge{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted);margin:0}
.view{display:flex;flex-direction:column;gap:var(--s3)}
.stack{display:flex;flex-direction:column;gap:var(--s1)}

/* Kopf */
header.top{display:flex;align-items:center;gap:var(--s2);min-height:var(--s6)}
.mark{width:var(--s6);height:var(--s6);border-radius:var(--r);background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mark);font-size:24px;line-height:24px;font-weight:700;flex:none}

/* Tab-Leiste: Signalpunkt über dem aktiven Bereich */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(var(--s2),env(safe-area-inset-left,0px));padding-right:max(var(--s2),env(safe-area-inset-right,0px))}
.tabbar-in{max-width:544px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;height:var(--s8)}
.tabbar button{appearance:none;border:0;background:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;cursor:pointer}
.tabbar button::before{content:"";position:absolute;top:var(--s1);width:var(--s1);height:var(--s1);border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"]::before{opacity:1}
.tabbar svg{width:24px;height:24px;margin-top:var(--s1)}

/* Icons */
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Tasten: matt, ohne Rahmen, wie Bedienelemente eines Geräts. Orange nur für die eine nächste Handlung. */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);height:var(--s6);padding:0 var(--s3);border:0;background:var(--key);color:var(--ink);border-radius:var(--r);font-weight:500;font-size:16px;line-height:24px;cursor:pointer;transition:background .15s}
.btn:active{background:var(--key-down)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.textbtn{appearance:none;background:none;border:0;color:var(--muted);font-size:16px;line-height:24px;cursor:pointer;padding:var(--s1) 0;display:inline-flex;align-items:center;gap:var(--s1);align-self:flex-start}
@media (hover:hover){.btn:not(.primary):not(:disabled):hover,.ctl:not(.primary):not(:disabled):hover,.iconbtn:hover{background:var(--key-down)}.textbtn:hover{color:var(--ink)}}

/* Lektionsliste */
.progress{display:flex;flex-direction:column;gap:var(--s1)}
.progress-row{display:flex;justify-content:space-between;align-items:baseline}
.progress-num{font-family:var(--f-display);font-size:32px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.progress-num small{font-family:var(--f-body);font-size:16px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:var(--s1)}
.bar{height:var(--s1);background:var(--key);border-radius:var(--r);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:var(--r);transition:width .4s}
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.lesson-row,.train-row{appearance:none;width:100%;min-height:var(--s8);display:grid;grid-template-columns:var(--s5) 1fr auto;align-items:center;gap:var(--s2);padding:var(--s1) 0;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer}
@media (hover:hover){.lesson-row:hover .t,.train-row:hover .t{color:var(--accent)}}
.num{font-size:16px;line-height:24px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.lt{display:flex;flex-direction:column;min-width:0}
.lt .t{font-weight:700}
.lt .d{color:var(--muted)}
.st{font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.st.done{width:var(--s3);height:var(--s3);border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.st.next{color:var(--accent);display:inline-flex;align-items:center;gap:var(--s1);letter-spacing:.04em;text-transform:uppercase}
.st.next::before{content:"";width:var(--s1);height:var(--s1);border-radius:50%;background:var(--accent)}
.cta{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);border-radius:var(--r);background:var(--surface)}
.cta p{margin:0;color:var(--muted)}
.cta strong{color:var(--ink);display:block}

/* Lektion */
.prose{display:flex;flex-direction:column;gap:var(--s2);max-width:62ch}
.prose p{margin:0}
.prose ol{margin:0;padding-left:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.task{background:var(--surface);border-radius:var(--r);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1)}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.task p{margin:0;font-weight:500}
.steps{display:flex;gap:var(--s1)}
.steps i{width:var(--s1);height:var(--s1);border-radius:50%;background:var(--rule)}
.steps i.on{background:var(--ink)}
.feedback{margin:0;padding:var(--s2);border-radius:var(--r);display:flex;gap:var(--s1);align-items:flex-start}
.feedback[data-state="ok"]{background:var(--good-soft);color:var(--good)}
.feedback[data-state="bad"]{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;flex-direction:column;gap:var(--s1)}

/* Brett: das eigentliche Objekt. Ehrliches Material, keine Schatten. */
.board{width:100%;max-width:528px;margin:0 auto;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
.board svg{display:block;width:100%;height:auto;border-radius:var(--r)}
.co{font-family:var(--f-body);font-size:11px;fill:var(--coord);font-weight:500}
.ln{font-family:var(--f-body);font-size:15px;font-weight:700}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.drop{transform-box:fill-box;transform-origin:center;animation:drop .2s ease-out}
@keyframes drop{from{transform:scale(1.12);opacity:.3}}
@media (prefers-reduced-motion: reduce){.pulse,.drop{animation:none}.bar span{transition:none}}

/* Spielen */
.statusbar{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);min-height:var(--s5)}
.turn{font-weight:700;display:flex;align-items:center;gap:var(--s1)}
.spark{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;opacity:0;transition:opacity .3s}
body.thinking .spark{opacity:1;animation:spark 1.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spark{0%{transform:rotate(0) scale(.85)}50%{transform:rotate(90deg) scale(1.1)}100%{transform:rotate(180deg) scale(.85)}}
@media (prefers-reduced-motion: reduce){body.thinking .spark{animation:none}}
.dot{width:var(--s2);height:var(--s2);border-radius:50%;background:var(--stone-b2);box-shadow:0 0 0 1px var(--stone-edge);display:inline-block;flex:none}
.dot.w{background:var(--stone-w1);box-shadow:inset 0 0 0 1px var(--stone-edge)}
.dot.sm{width:var(--s1);height:var(--s1)}
.caps{display:flex;align-items:center;gap:var(--s2);font-size:16px;line-height:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.caps span{display:inline-flex;align-items:center;gap:var(--s1)}
.status-right{display:flex;align-items:center;gap:var(--s2)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1)}
.ctl{appearance:none;height:var(--s5);display:flex;gap:var(--s1);align-items:center;justify-content:center;border:0;background:var(--key);border-radius:var(--r);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink);padding:0;transition:background .15s}
.ctl:active{background:var(--key-down)}
.ctl .ic{width:16px;height:16px}
.ctl:disabled{opacity:.4;cursor:default}
.ctl.primary{background:var(--accent);color:var(--accent-ink)}
.iconbtn{appearance:none;width:var(--s5);height:var(--s5);display:grid;place-items:center;border:0;background:var(--key);border-radius:50%;cursor:pointer;color:var(--ink);padding:0;transition:background .15s}
.iconbtn:active{background:var(--key-down)}
.iconbtn .ic{width:16px;height:16px}

/* Trainer: eine ruhige Fläche, kein Rahmen */
.coach-card{background:var(--surface);border-radius:var(--r);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1)}
button.coach-card{appearance:none;border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;flex:none}
.coach-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s1)}
.coach-head .ic{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.coach-card.open .coach-head .ic{transform:rotate(180deg)}
.badge.trainer{color:var(--accent)}
.coach-now{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:48px}
.coach-card.open .coach-now{display:block;-webkit-line-clamp:none}
.coach-old{display:flex;flex-direction:column;gap:var(--s1);border-top:1px solid var(--rule);padding-top:var(--s1)}
.coach-old:empty{display:none}
.coach-old span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.coach-card.open .coach-old span{display:block;-webkit-line-clamp:none}
.coach-old b{font-weight:500;color:var(--ink);margin-right:var(--s1)}
.scorebox{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2);border-radius:var(--r);background:var(--surface)}
.scorebox p{margin:0;color:var(--muted)}
.scorebox .nums{font-family:var(--f-display);font-size:24px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums}
.scorebox .row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.scorebox .row .btn{padding:0 var(--s2);white-space:nowrap}

/* Einstellungen */
.sheet-backdrop{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:576px;background:var(--surface);border-radius:var(--r2) var(--r2) 0 0;padding:var(--s3) max(var(--s2),env(safe-area-inset-right,0px)) calc(var(--s3) + env(safe-area-inset-bottom,0px)) max(var(--s2),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--s3)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet{max-height:calc(100% - var(--s4));overflow-y:auto;overscroll-behavior:contain}
.sheet h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:32px;font-weight:700}
.settings{display:flex;flex-direction:column;gap:var(--s2)}
.field{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--s1);padding:0;background:none}
.seg button{appearance:none;border:0;background:var(--key);border-radius:var(--r);height:var(--s5);font-weight:500;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);cursor:pointer;min-height:var(--s5)}
.switch input{appearance:none;width:var(--s6);height:var(--s3);border-radius:var(--r2);background:var(--key-down);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:0;left:0;width:var(--s3);height:var(--s3);border-radius:50%;background:var(--stone-w1);box-shadow:inset 0 0 0 2px var(--key-down);transition:transform .2s,box-shadow .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(var(--s3));box-shadow:inset 0 0 0 2px var(--accent)}
.record{color:var(--muted);margin:0}
.record:empty{display:none}

/* Spielansicht: genau ein Bildschirm, das Brett nimmt den Rest der Höhe */
html.fit,html.fit body{height:100%;overflow:hidden;overscroll-behavior:none}
html.fit .app{height:100%;padding-block:var(--s2) calc(var(--s8) + var(--s2));gap:var(--s2)}
html.fit header.top{display:none}
html.fit main{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
html.fit #view-play,html.fit #view-drill{flex:1 1 0;min-height:0;gap:var(--s2)}
html.fit .board-wrap{place-items:center}
html.fit .coach-card{padding:var(--s1) var(--s2);gap:0}
.board-wrap{flex:1 1 0;min-height:0;container-type:size;display:grid;place-items:center}
.haptic-host{position:relative;display:block;-webkit-tap-highlight-color:transparent}
.haptic-host.board-wrap{display:grid}
.hsw{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:.01;pointer-events:none}
.board-wrap .board{width:min(100cqw,100cqh);max-width:none;margin:0}
@supports not (width:1cqw){.board-wrap .board{width:auto;height:100%;max-width:100%;aspect-ratio:1}}

/* Training */
.train-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s1)}
.chap{padding:var(--s4) 0 var(--s1);border-bottom:1px solid var(--rule)}
.chap:first-child{padding-top:var(--s1)}
.daily{display:grid;grid-template-columns:var(--s5) 1fr auto;align-items:center;gap:var(--s2);padding:var(--s2);border-radius:var(--r);background:var(--surface)}
.daily .lt .t{font-weight:700}
.daily-eb{grid-column:1/-1;margin-bottom:calc(var(--s1) * -1)}
.daily .d{color:var(--muted);font-variant-numeric:tabular-nums}
.daily .d .acc{color:var(--accent)}
.daily .btn{padding:0 var(--s2);height:var(--s5);font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase}
.rank-line{display:block;color:var(--ink);margin-top:var(--s1)}
.an{display:flex;flex-direction:column;gap:var(--s1);flex:none}
.an[hidden]{display:none}
.an-graph{display:block;width:100%;height:var(--s8);border-radius:var(--r);background:var(--surface);cursor:pointer;touch-action:none}
.an-text{margin:0;min-height:var(--s6);padding:0 var(--s1);font-variant-numeric:tabular-nums}
.an-text small{display:block;color:var(--muted);font-size:16px;line-height:24px}
.an-text .acc{color:var(--accent);font-weight:700}
.stat{background:var(--surface);border-radius:var(--r);padding:var(--s2);display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:32px;line-height:40px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tglyph{width:var(--s5);height:var(--s5);border-radius:var(--r);background:var(--board);display:grid;place-items:center}
.tglyph svg{width:var(--s4);height:var(--s4)}
.chip{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;padding:var(--s1) var(--s2);border-radius:var(--r2);background:var(--key);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.drill-title{flex:1;min-width:0;display:flex;flex-direction:column}
.drill-title .turn{font-size:16px;line-height:24px}
.controls.three{grid-template-columns:repeat(3,1fr)}
/* Bedientasten unter dem Brett: runde Taste mit Symbol, Beschriftung darunter – wie an einem Braun-Gerät */
.controls .ctl{flex-direction:column;height:auto;gap:var(--s1);background:none;color:var(--muted);letter-spacing:.08em}
.controls .ctl .ic{display:block;width:var(--s5);height:var(--s5);padding:var(--s1);stroke-width:1.5;border-radius:50%;background:var(--key);color:var(--ink);transition:background .15s}
.controls .ctl:active .ic{background:var(--key-down)}
@media (hover:hover){.controls .ctl:not(:disabled):hover{background:none;color:var(--ink)}.controls .ctl:not(:disabled):not(.primary):hover .ic{background:var(--key-down)}}
.controls .ctl.primary{background:none;color:var(--accent)}
.controls .ctl.primary .ic{background:var(--accent);color:var(--accent-ink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.choices .ctl{height:var(--s6);font-size:16px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.dr-fb{background:var(--surface);border-radius:var(--r);padding:var(--s1) var(--s2);display:flex;gap:var(--s1);align-items:flex-start;min-height:var(--s8);flex:none}

.fb-tag{display:inline-flex;align-items:center;gap:var(--s1);margin-right:var(--s1);font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.fb-tag::before{content:"";width:var(--s1);height:var(--s1);border-radius:50%;background:currentColor}
.fb-tag.ok{color:var(--good)}
.fb-tag.bad{color:var(--warn)}
.dr-fb small{display:block;color:var(--muted);font-size:16px;line-height:24px}

/* Spielerleiste: wer am Zug ist, ist hervorgehoben */
.players{display:flex;align-items:center;gap:var(--s1);min-width:0;flex:1;overflow:hidden}
.pl{display:inline-flex;align-items:center;gap:var(--s1);height:var(--s5);padding:0 var(--s2);border-radius:var(--s3);color:var(--muted);white-space:nowrap;min-width:0;transition:background .2s,color .2s}

.result-line{font-size:16px;line-height:24px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Rückmeldung: feste Höhe, Begründung auf Wunsch */
.dr-fb{align-items:center}
.dr-fb .fb-text{flex:1;min-width:0}
.dr-fb .fb-main{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.why{appearance:none;border:0;background:none;color:inherit;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:var(--s1) 0 var(--s1) var(--s1);cursor:pointer;text-decoration:underline;text-underline-offset:4px;flex:none}

.vanish{transform-box:fill-box;transform-origin:center;animation:vanish .3s ease-in forwards}
@keyframes vanish{to{opacity:0;transform:scale(.6)}}
.lesson-row.locked{cursor:default}
.lesson-row.locked .t,.lesson-row.locked .num{color:var(--muted)}
.lesson-row.locked .t{font-weight:500}
.st.lock{color:var(--muted);display:grid;place-items:center;width:var(--s3);height:var(--s3)}
.st.lock .ic{width:16px;height:16px}
.lesson-row.nope{animation:nope .36s ease-in-out}
@keyframes nope{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* Lektion geschafft */
.cele{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:var(--s3);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:celeIn .22s ease-out;cursor:pointer}
.cele[hidden]{display:none}
.cele.out{animation:celeOut .28s ease-in forwards}
@keyframes celeIn{from{opacity:0}}
@keyframes celeOut{to{opacity:0}}
.cele-in{display:flex;flex-direction:column;align-items:center;gap:var(--s1);text-align:center;width:100%;max-width:320px}
.cele-mark{position:relative;width:96px;height:96px;margin-bottom:var(--s3)}
.cele-stone{position:absolute;inset:0;width:96px;height:96px;animation:celePop .62s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18))}
@keyframes celePop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.cele-check{stroke-dasharray:56;stroke-dashoffset:56;animation:celeDraw .36s .42s ease-out forwards}
@keyframes celeDraw{to{stroke-dashoffset:0}}
.cele-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:celeRing .9s .12s cubic-bezier(.1,.6,.3,1) both}
.cele-ring.r2{animation-delay:.3s;border-width:1px}
@keyframes celeRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.cele-dot{position:absolute;left:50%;top:50%;width:var(--sz);height:var(--sz);margin:calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2);border-radius:50%;opacity:0;animation:celeBurst .9s var(--d) cubic-bezier(.15,.8,.3,1) both}
.cele-dot.b{background:radial-gradient(circle at 36% 30%,var(--stone-b1),var(--stone-b2))}
.cele-dot.w{background:radial-gradient(circle at 36% 30%,var(--stone-w1),var(--stone-w2));box-shadow:inset 0 0 0 1px var(--stone-edge)}
.cele-dot.a{background:var(--accent)}
@keyframes celeBurst{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.cele-txt{display:flex;flex-direction:column;align-items:center;gap:var(--s1);width:100%;animation:celeUp .4s .38s ease-out both}
@keyframes celeUp{from{opacity:0;transform:translateY(var(--s2))}}
.cele-txt .eyebrow{color:var(--accent)}
.cele-txt h2{margin:0;font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em}
.cele-bar{width:100%;height:4px;border-radius:2px;background:var(--key);overflow:hidden;margin-top:var(--s2)}
.cele-bar span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .7s .65s cubic-bezier(.3,.9,.3,1)}

@media (prefers-reduced-motion: reduce){.cele,.cele *{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}.cele-dot,.cele-ring{display:none}.cele-check{stroke-dashoffset:0}}

<script type="text/plain" id="mcts-src">
// Monte-Carlo-Baumsuche (UCT + RAVE) mit schnellem Playout-Brett. Läuft im Web Worker.
let n=9,W=11,SZ=121,D4=[1,-1,11,-11],DG=[12,10,-10,-12];
let bd,hd,nx,pl,cs,ko,emp,ep,ne;          // aktuelles Brett
let sbd,shd,snx,spl,scs,sko,semp,sep,sne; // Sicherung der Wurzelstellung
function setup(size){n=size;W=n+2;SZ=W*W;D4=[1,-1,W,-W];DG=[W+1,W-1,-W+1,-W-1];
  bd=new Int8Array(SZ);hd=new Int16Array(SZ);nx=new Int16Array(SZ);pl=new Int16Array(SZ);cs=new Int16Array(SZ);emp=new Int16Array(SZ);ep=new Int16Array(SZ);
  sbd=new Int8Array(SZ);shd=new Int16Array(SZ);snx=new Int16Array(SZ);spl=new Int16Array(SZ);scs=new Int16Array(SZ);semp=new Int16Array(SZ);sep=new Int16Array(SZ)}
function saveRoot(){sbd.set(bd);shd.set(hd);snx.set(nx);spl.set(pl);scs.set(cs);semp.set(emp);sep.set(ep);sne=ne;sko=ko}
function loadRoot(){bd.set(sbd);hd.set(shd);nx.set(snx);pl.set(spl);cs.set(scs);emp.set(semp);ep.set(sep);ne=sne;ko=sko}
function empAdd(p){ep[p]=ne;emp[ne++]=p}

  punkte:['Grote punten','De waardevolste openingszet','Speel de grootste zet op het bord.','Eerst de hoeken: daar heb je de minste stenen nodig voor zeker gebied.']}
}};

/* Lektionstexte je Sprache: title, sum, body, list, after, tasks, m (Rückmeldungen der Aufgaben) */
const LTXT={
de:{
 brett:{title:'Das Brett',sum:'Schnittpunkte, Zugfolge, Ziel',
  body:['Go spielt man auf den <b>Schnittpunkten</b> der Linien, nicht in den Feldern. Profis nutzen ein 19×19-Brett. Zum Lernen sind 9×9 oder kleiner ideal.','Schwarz beginnt, danach setzen beide abwechselnd je einen Stein. Gesetzte Steine werden nie verschoben.','Das Ziel: Am Ende hast du mehr Fläche des Bretts umschlossen als dein Gegner.'],
  tasks:['Setze einen Stein auf den markierten Punkt. Die Mitte des Bretts heißt Tengen.'],
  m:{a:'Genau. Jeder Stein steht auf einem Schnittpunkt.',b:'Gültiger Punkt, aber nicht der markierte. Versuch es nochmal.'}},
 freiheiten:{title:'Freiheiten',sum:'Wie viel Luft ein Stein hat',
  body:['Jeder Stein braucht Luft. Die leeren Punkte direkt neben ihm (oben, unten, links, rechts) heißen <b>Freiheiten</b>. Diagonale Punkte zählen nicht.','In der Mitte hat ein Stein 4 Freiheiten, am Rand 3, in der Ecke nur 2. Die blauen Punkte zeigen sie dir.'],
  tasks:['Nimm dem weißen Stein eine Freiheit, indem du direkt neben ihn setzt.','Dieser Stein steht in der Ecke und hat nur 2 Freiheiten. Nimm ihm eine davon.'],
  m:{a:'Richtig. Er hat jetzt nur noch 3 Freiheiten.',b:'Diagonal oder weiter weg nimmt ihm keine Freiheit. Setze direkt auf einen blauen Punkt.',c:'Genau. Jetzt hat er nur noch eine Freiheit. Man sagt: Er steht im Atari.',d:'Setze direkt neben den Stein in der Ecke.'}},
 schlagen:{title:'Schlagen',sum:'Die letzte Freiheit nehmen',
  body:['Nimmst du einem Stein seine <b>letzte</b> Freiheit, ist er geschlagen. Er wird vom Brett genommen und zählt als Gefangener.','Hat ein Stein nur noch eine Freiheit, steht er im <b>Atari</b>. Das ist die wichtigste Warnung im ganzen Spiel. Im Spielmodus markiert ein roter Ring solche Steine.'],
  tasks:['Der weiße Stein steht im Atari. Schlage ihn.','Auch am Rand: Schlage den weißen Stein.'],
  m:{a:'Geschlagen! Der Stein ist weg und zählt für dich.',b:'Der weiße Stein hat noch eine Freiheit. Finde den leeren Punkt direkt neben ihm.',c:'Richtig. Am Rand reichen weniger Steine zum Schlagen.',d:'Am Rand fehlt die untere Seite. Welche Freiheit bleibt ihm noch?'}},
 gruppen:{title:'Gruppen',sum:'Verbundene Steine teilen Freiheiten',
  body:['Steine gleicher Farbe, die waagerecht oder senkrecht nebeneinander liegen, bilden eine <b>Gruppe</b>. Sie teilen sich ihre Freiheiten und werden nur gemeinsam geschlagen.','Diagonal liegende Steine sind nicht verbunden. Größere Gruppen sind meist schwerer zu fangen, weil sie mehr Freiheiten haben.'],
  tasks:['Die zwei weißen Steine sind eine Gruppe mit nur einer Freiheit. Schlage beide.'],
  m:{a:'Beide auf einmal geschlagen. So funktionieren Gruppen.',b:'Suche die letzte gemeinsame Freiheit der beiden weißen Steine.'}},
 retten:{title:'Atari: Retten',sum:'Verlängern oder zurückschlagen',
  body:['Steht eine deiner Gruppen im Atari, musst du meist sofort reagieren. Es gibt zwei Wege:','<b>Verlängern:</b> Setze an deine Gruppe an, damit sie neue Freiheiten bekommt. <b>Zurückschlagen:</b> Schlage einen angreifenden Stein, der selbst im Atari steht.'],
  tasks:['Dein Stein steht im Atari. Rette ihn durch Verlängern.','Wieder Atari. Diesmal hilft Verlängern nicht. Finde die Rettung.'],
  m:{a:'Gerettet. Deine Gruppe hat jetzt 3 Freiheiten.',b:'Dein Stein steht immer noch im Atari. Wo bekommt er neue Freiheiten?',c:'Stark. Du schlägst den Angreifer und dein Stein bekommt neue Luft.',d:'Schau dir den weißen Stein unter deinem an. Wie viele Freiheiten hat er?'}},
 verboten:{title:'Verbotene Punkte',sum:'Selbstmord und die Ausnahme',
  body:['Du darfst keinen Stein dorthin setzen, wo er (samt seiner Gruppe) sofort keine Freiheit hätte. Das wäre <b>Selbstmord</b>.','<b>Ausnahme:</b> Schlägt dein Zug dabei gegnerische Steine, ist er erlaubt. Durch das Schlagen entstehen neue Freiheiten.'],
  tasks:['Eine leere Ecke ist für dich verboten, die andere nicht. Finde den erlaubten Zug, der schlägt.'],
  m:{a:'Richtig. Ohne Schlagen wäre der Punkt verboten. Weil du schlägst, ist er erlaubt.',b:'Das schlägt nichts. Suche den leeren Punkt, an dem Weiß selbst keine Luft mehr hat.'}},
 ko:{title:'Ko',sum:'Kein sofortiges Zurückschlagen',
  body:['Manchmal könnten beide endlos abwechselnd einen einzelnen Stein zurückschlagen. Die <b>Ko-Regel</b> verbietet das: Nach so einem Schlag darf der Gegner nicht sofort zurückschlagen.','Er muss zuerst woanders spielen, am besten eine Drohung, auf die du antworten musst. Erst danach darf er zurückschlagen.'],
  tasks:['Schlage den weißen Stein in der Mitte.','Weiß hat gerade mit dem markierten Stein deinen Stein geschlagen. Versuche zurückzuschlagen, dann spiele woanders.'],
  m:{a:'Geschlagen. Weiß dürfte jetzt nicht sofort zurückschlagen, obwohl es so aussieht. Das ist Ko.',b:'Der weiße Stein in der Mitte hat nur eine Freiheit. Wo?',c:'Richtig. Nach einem Zug woanders darfst du den Ko wieder schlagen, falls Weiß ihn nicht vorher schließt.'}},
 augen:{title:'Zwei Augen',sum:'Wann eine Gruppe lebt',
  body:['Ein <b>Auge</b> ist ein leerer Punkt, der ganz von deiner Gruppe umschlossen ist. Der Gegner darf dort nicht setzen, außer er schlägt damit.','Hat eine Gruppe <b>zwei getrennte Augen</b>, kann sie nie geschlagen werden: Der Gegner müsste beide gleichzeitig füllen. Sie lebt für immer.','Bei drei leeren Punkten in einer Reihe entscheidet der mittlere. Wer ihn zuerst besetzt, entscheidet über Leben oder Tod.'],
  tasks:['Deine Gruppe unten links ist eingeschlossen. Sorge für zwei Augen.','Jetzt umgekehrt: Töte die weiße Gruppe.'],
  m:{a:'Zwei getrennte Augen. Deine Gruppe lebt, Weiß kann sie nie schlagen.',b:'Jetzt bleibt nur ein Auge übrig. Probier den mittleren Punkt.',c:'Wenn du hier nicht reagierst, setzt Weiß in die Mitte und deine Gruppe hat nur noch ein Auge.',d:'Getroffen. Weiß kann nur noch ein Auge bilden. Die Gruppe ist tot.',e:'Weiß kann jetzt in die Mitte setzen und zwei Augen bilden. Nimm den Schlüsselpunkt.'}},
 zaehlen:{title:'Spielende & Zählen',sum:'Passen, Gebiet, Komi',
  body:['Das Spiel endet, wenn beide nacheinander <b>passen</b>, weil kein Zug mehr etwas bringt.','Gezählt wird so: deine Steine auf dem Brett plus alle leeren Punkte, die nur deine Steine umschließen. Gruppen, die nicht mehr leben können, werden vorher entfernt.','Geschlagene Steine zählen dabei nicht extra. Sie bringen trotzdem Punkte: Sie fehlen dem Gegner auf dem Brett, und ihr Platz wird dein Gebiet.','Weil Schwarz anfängt, bekommt Weiß einen Ausgleich, das <b>Komi</b>. In dieser App sind es 7,5 Punkte. Der halbe Punkt verhindert ein Unentschieden.'],
  tasks:['Die Grenze zwischen den Gebieten hat eine Lücke. Schließe sie, sonst dringt Weiß in dein Gebiet ein.'],
  m:{a:'Grenze dicht. Schwarz: 7 Steine + 21 leere Punkte = 28. Weiß: 7 Steine + 14 Punkte = 21.',b:'Die Lücke liegt auf der Grenze zwischen Schwarz und Weiß.'}},
 ecken:{title:'Ecke, Seite, Mitte',sum:'Die erste Strategie',
  body:['In der Ecke helfen dir zwei Ränder beim Einschließen. Für dieselbe Fläche brauchst du dort viel weniger Steine als in der Mitte.','Darum gilt in der Eröffnung: <b>erst Ecken, dann Seiten, zuletzt die Mitte.</b>','Die 1. und 2. Linie vom Rand sind am Anfang zu niedrig. Die 3. Linie sichert Gebiet, die 4. Linie bringt mehr Einfluss.'],
  tasks:['Das 9×9-Brett ist leer. Wähle einen guten ersten Zug.'],
  m:{ok:l=>`Guter Eröffnungszug auf der ${l}. Linie. Von hier lässt sich die Ecke gut einschließen.`,low:'Zu nah am Rand. Auf der 1. und 2. Linie entsteht kaum Gebiet. Geh auf die 3. oder 4. Linie.',mid:'Die Mitte ist schwer zu sichern. Versuch es in einer Ecke.',side:'Die Seite ist okay, aber am Anfang ist die Ecke wertvoller.'}},
 schneiden:{title:'Verbinden & Schneiden',sum:'Schnittpunkte erkennen',
  body:['Verbundene Steine sind stark. Getrennte Gruppen müssen jede für sich überleben. Achte auf <b>Schnittpunkte</b>: leere Punkte, an denen der Gegner deine Steine trennen kann.','Faustregel: Verbinde deine eigenen Steine, schneide die des Gegners.'],
  tasks:['Weiß droht, deine beiden Steine zu trennen. Verbinde sie.','Jetzt umgekehrt: Schneide die weißen Steine voneinander.'],
  m:{a:'Verbunden. Gleichzeitig trennst du die weißen Steine.',b:'Deine Steine sind noch getrennt. Wo liegt der Punkt zwischen ihnen?',c:'Geschnitten. Merke: Der wichtige Punkt des Gegners ist oft auch deiner.',d:'Weiß kann sich noch verbinden. Nimm den Punkt zwischen den weißen Steinen.'}},
 plan:{title:'Dein Denkplan',sum:'Checkliste für jeden Zug',
  body:['Starke Spieler stellen sich vor jedem Zug dieselben Fragen. Geh sie in dieser Reihenfolge durch:'],
  list:['Steht eine meiner Gruppen im Atari? Dann retten, oder bewusst aufgeben, wenn sie nicht mehr zu retten ist.','Kann ich etwas schlagen oder den Gegner ins Atari setzen?','Hat der letzte Zug des Gegners etwas bedroht? Wo will er hin?','Sind meine Gruppen verbunden? Gibt es gefährliche Schnittpunkte?','Wo ist der größte freie Bereich? Am Anfang: Ecken, dann Seiten.','Nie in das eigene Auge setzen.'],
  after:'Im Spielmodus kommentiert der Trainer jeden deiner Züge. Mit „Tipp“ zeigt er dir eine starke Idee, mit „Zurück“ kannst du sie ausprobieren.'},
 form:{title:'Gute Form',sum:'Leeres Dreieck und Tigermaul',
  body:['Gute Steine erreichen mit wenig Aufwand viel. Drei Steine im Winkel, bei denen der vierte Punkt leer bleibt, heißen <b>leeres Dreieck</b>. Sie haben kaum mehr Freiheiten als zwei Steine und decken wenig Fläche ab. Das ist schlechte Form.','Gute Form ist zum Beispiel das <b>Tigermaul</b>: Drei Steine umschließen einen leeren Punkt von drei Seiten. Setzt der Gegner hinein, steht sein Stein sofort im Atari. So schützt du einen Schnittpunkt, ohne ihn selbst zu besetzen.'],
  tasks:['Verlängere deine beiden Steine, ohne ein leeres Dreieck zu bilden.','Weiß will bei D4 zwischen deine Steine drücken. Schütze den Punkt mit einem Tigermaul.'],
  m:{a:'Gute Form. Eine gerade Linie hat viele Freiheiten und arbeitet effizient.',b:'Das ist ein leeres Dreieck: drei Steine, aber kaum mehr Freiheiten als zwei. Verlängere lieber gerade.',c:'Bleib in Kontakt. Setze direkt neben deine Steine.',
   d:'Tigermaul. Setzt Weiß jetzt auf D4, steht der Stein sofort im Atari. Und du blockierst Weiß von unten.',e:'Das verbindet auch, ist aber schwerfällig. Das Tigermaul schützt D4 und blockiert Weiß zugleich.',f:'D4 bleibt so ungeschützt. Setze so, dass drei deiner Steine D4 umschließen.'}},
 leiter:{title:'Die Leiter',sum:'Fangen im Zickzack',
  body:['Hat ein Stein nur zwei Freiheiten, kannst du ihn oft mit einer <b>Leiter</b> fangen. Du gibst immer wieder Atari, so dass er nach jedem Verlängern wieder nur zwei Freiheiten hat. Die Steine laufen im Zickzack über das Brett, bis der Rand sie stoppt.','Wichtig ist die Seite: Gib Atari so, dass der Gegner in Richtung deiner Steine laufen muss.','Steht auf dem Weg ein Stein des Gegners, ein <b>Leiterbrecher</b>, entkommt er. Prüfe deshalb vorher die Diagonale.'],
  tasks:['Fange den weißen Stein mit ▲. Weiß wehrt sich. Gib so lange Atari, bis er geschlagen ist.'],
  m:{a:'Gefangen. Die Leiter lief bis zum Rand.',b:w=>`Weiß entkommt${w?' bei '+w:''}. Gib Atari von der Seite, auf der Weiß danach nur zwei Freiheiten hat.`,c:w=>`Weiß verlängert auf ${w}. Weiter: wieder Atari.`,e:w=>`Weiß spielt ${w}. Die Gruppe steht aber noch im Atari. Schlage sie.`}},
 seki:{title:'Seki',sum:'Leben ohne zwei Augen',
  body:['Manchmal kann keine Seite die andere fangen. Zwei Gruppen teilen sich ihre letzten Freiheiten, und wer zuerst hineinsetzt, setzt sich selbst ins Atari. Das heißt <b>Seki</b>: Beide Gruppen leben, auch ohne zwei Augen.','Im Seki lässt man die gemeinsamen Punkte leer. Sie zählen für niemanden.'],
  tasks:['Unten links teilen sich deine zwei Steine und die weiße Gruppe die Punkte B1 und B2. Setze einen Stein, ohne das Seki zu zerstören.'],
  m:{a:'Richtig. Du lässt das Seki in Ruhe. Beide Gruppen leben, B1 und B2 zählen für niemanden.',b:'Jetzt hat deine Gruppe nur noch eine Freiheit. Weiß schlägt und lebt. Im Seki setzt niemand zuerst hinein.'}},
 endspiel:{title:'Endspiel',sum:'Grenzen schließen',
  body:['Gegen Ende sind die Gebiete fast fertig. Jetzt geht es um die letzten <b>Grenzen</b>. Eine Lücke in deiner Mauer kostet Punkte: Der Gegner setzt hinein und verkleinert dein Gebiet.','Die Reihenfolge: Zuerst Lücken schließen, die Punkte kosten. Neutrale Punkte zwischen den Mauern heißen <b>Dame</b>. Sie bringen niemandem etwas und kommen ganz zuletzt.'],
  tasks:['Es gibt eine Lücke in deiner Mauer und einen neutralen Punkt. Spiele den wertvollsten Zug.'],
  m:{a:'Genau. C2 schließt deine Grenze. Sonst setzt Weiß dort hinein und nimmt dir Punkte.',b:'D5 ist neutral. Der Punkt bringt niemandem etwas. Suche die Lücke in deiner Mauer.',c:'Das blockt auch, kostet dich aber einen Punkt im eigenen Gebiet. Schließe die Lücke direkt in der Mauer.',d:'Dieser Zug bringt nichts. Suche die Lücke in deiner schwarzen Mauer.'}},
 tod:{title:'Leben und Tod',sum:'Augenformen und der Schlüsselpunkt',
  body:['Ob eine Gruppe lebt, hängt an der Form ihres Innenraums. Fast jede Form hat einen <b>Schlüsselpunkt</b>: Wer ihn zuerst besetzt, entscheidet über Leben und Tod.','Drei Punkte in einer Reihe oder im Winkel: Der Schlüsselpunkt ist die Mitte bzw. der Knick. Vier in einer Reihe leben von selbst. Vier als Quadrat sind tot. Vier als Pyramide: Der Schlüsselpunkt ist die Spitze in der Mitte.'],
  tasks:['Unten links: Deine Gruppe hat einen Raum im Winkel (A2, A1, B1). Mach zwei Augen.','Jetzt umgekehrt: Weiß hat eine Pyramide aus vier Punkten. Töte die Gruppe.'],
  m:{a:'Lebt. A2 und B1 sind jetzt zwei getrennte Augen. Weiß kann in keins hineinsetzen.',b:'Damit bleibt nur ein Raum aus zwei Punkten, also ein Auge. Der Schlüsselpunkt ist der Knick in der Ecke.',c:'Weiß setzt jetzt auf A1 und deine Gruppe hat nur noch ein Auge. Besetze den Knick selbst.',
   d:'Getötet. Nach C1 kann Weiß nur noch ein Auge bilden. Die Gruppe ist tot.',e:'Jetzt setzt Weiß auf C1 und bekommt zwei Augen. Der Schlüsselpunkt ist die Mitte der Pyramide.',f:'Von außen tötest du die Gruppe nicht. Setze in ihren Innenraum, auf den Schlüsselpunkt.'}},
 kokampf:{title:'Ko-Kampf',sum:'Drohen, dann zurückschlagen',
  body:['Im Ko darfst du nicht sofort zurückschlagen. Du brauchst zuerst eine <b>Ko-Drohung</b>: einen Zug woanders, auf den der Gegner antworten muss. Antwortet er, darfst du den Ko zurücknehmen.','Gute Drohungen sind Ataris auf Gruppen, deren Verlust weh tut. Wer mehr Drohungen hat, gewinnt den Ko.'],
  tasks:['Weiß hat gerade den Ko bei D4 genommen. E4 ist für dich gesperrt. Spiele eine Ko-Drohung.','Weiß hat auf G5 verbunden. Jetzt ist der Ko wieder frei. Nimm ihn zurück.'],
  m:{a:'Starke Drohung: zwei weiße Steine stehen im Atari. Weiß muss antworten.',b:'Darauf muss Weiß nicht antworten. Eine Drohung setzt eine Gruppe ins Atari. Schau oben rechts.',c:'Ko zurückgenommen. Jetzt braucht Weiß eine Drohung.',d:'Schlage den Stein auf D4 zurück. Spiele auf E4.'}},
 eroeffnung:{title:'Eröffnung',sum:'Ecken, dann Seiten',
  body:['In der Eröffnung verteilen beide ihre Steine über das Brett. Die Reihenfolge ist fast immer gleich: zuerst die <b>Ecken</b>, dann die <b>Seiten</b>, zuletzt die Mitte.','Zwischen deinen Steinen auf der Seite entsteht Gebiet. Zwischen deinem und einem gegnerischen Stein ist der Punkt für beide wertvoll.'],
  tasks:['Schwarz hat C3, Weiß hat G7. Besetze eine freie Ecke.','Alle Ecken sind besetzt. Wo ist jetzt der größte Zug?'],
  m:{a:'Richtig. Eine weitere Ecke ist der größte Zug.',b:'Diese Ecke ist schon besetzt. Such eine freie.',c:'Zu nah am Rand. Auf der 1. und 2. Linie entsteht kaum Gebiet.',d:'Erst die Ecken. Zwei sind noch frei.',
   e:'Gut. Du verbindest deine beiden Ecken und baust Gebiet an der linken Seite.',f:'Mutig: Du steigst zwischen die weißen Ecken ein. Das stört Weiß, aber deine Steine dort sind allein.',g:'Sehr gut. Der Punkt zwischen dir und Weiß ist für beide wichtig.',h:'Die Mitte ist zu offen. Erst die Seiten.',i:'Das liegt zu nah an einer Ecke, die schon besetzt ist. Die Mitte einer Seite ist größer.'}},
 opfern:{title:'Steine opfern',sum:'Nicht jeden Stein retten',
  body:['Nicht jeder Stein lohnt die Rettung. Ein einzelner Stein tief im Gebiet des Gegners ist oft verloren. Läufst du damit weiter, schenkst du dem Gegner Züge, und am Ende fängt er ihn trotzdem.','Frag dich vor dem Retten: Ist der Stein wichtig? Kann er überhaupt entkommen? Wenn nicht, spiele lieber den größten Zug woanders.'],
  tasks:['Dein Stein auf H2 steht im Atari, tief im weißen Gebiet. Oben rechts ist eine Ecke frei. Was spielst du?'],
  m:{a:'Richtig. Die freie Ecke ist viel mehr wert als ein Stein, der nicht entkommen kann.',b:'Nach H1 hat deine Gruppe zwei Freiheiten am Rand. Weiß fängt sie trotzdem. Opfere den Stein und nimm die Ecke.',c:'Das ist klein. Oben rechts ist noch eine ganze Ecke frei.'}}
},
en:{
 brett:{title:'The board',sum:'Intersections, turns, goal',
  body:['Go is played on the <b>intersections</b> of the lines, not in the squares. Professionals use a 19×19 board. For learning, 9×9 or smaller is ideal.','Black moves first, then both players take turns placing one stone each. Stones are never moved once placed.','The goal: at the end, you have surrounded more of the board than your opponent.'],
  tasks:['Place a stone on the marked point. The center of the board is called tengen.'],
  m:{a:'Exactly. Every stone sits on an intersection.',b:'A valid point, but not the marked one. Try again.'}},
 freiheiten:{title:'Liberties',sum:'How much air a stone has',
  body:['Every stone needs air. The empty points directly next to it (above, below, left, right) are called <b>liberties</b>. Diagonal points do not count.','In the middle a stone has 4 liberties, on the edge 3, in the corner only 2. The blue dots show them to you.'],
  tasks:['Take a liberty away from the white stone by playing directly next to it.','This stone sits in the corner and has only 2 liberties. Take one of them away.'],
  m:{a:'Correct. It now has only 3 liberties.',b:'Diagonal or further away does not take a liberty. Play directly on a blue dot.',c:'Exactly. Now it has only one liberty left. We say: it is in atari.',d:'Play directly next to the stone in the corner.'}},
 schlagen:{title:'Capturing',sum:'Taking the last liberty',
  body:['If you take a stone’s <b>last</b> liberty, it is captured. It is removed from the board and counts as a prisoner.','When a stone has only one liberty left, it is in <b>atari</b>. That is the most important warning in the whole game. In play mode, a red ring marks such stones.'],
  tasks:['The white stone is in atari. Capture it.','On the edge too: capture the white stone.'],
  m:{a:'Captured! The stone is gone and counts for you.',b:'The white stone still has a liberty. Find the empty point right next to it.',c:'Correct. On the edge, fewer stones are needed to capture.',d:'On the edge, the bottom side is missing. Which liberty does it still have?'}},
 gruppen:{title:'Groups',sum:'Connected stones share liberties',
  body:['Stones of the same color that touch horizontally or vertically form a <b>group</b>. They share their liberties and can only be captured together.','Diagonal stones are not connected. Larger groups are usually harder to capture because they have more liberties.'],
  tasks:['The two white stones are one group with only one liberty. Capture both.'],
  m:{a:'Both captured at once. That is how groups work.',b:'Look for the last shared liberty of the two white stones.'}},
 retten:{title:'Atari: escaping',sum:'Extend or capture back',
  body:['If one of your groups is in atari, you usually have to react right away. There are two ways:','<b>Extend:</b> play next to your group so it gains new liberties. <b>Capture back:</b> capture an attacking stone that is itself in atari.'],
  tasks:['Your stone is in atari. Save it by extending.','Atari again. This time extending does not help. Find the rescue.'],
  m:{a:'Saved. Your group now has 3 liberties.',b:'Your stone is still in atari. Where does it get new liberties?',c:'Strong. You capture the attacker and your stone gets new air.',d:'Look at the white stone below yours. How many liberties does it have?'}},
 verboten:{title:'Forbidden points',sum:'Suicide and the exception',
  body:['You may not play a stone where it (together with its group) would immediately have no liberty. That would be <b>suicide</b>.','<b>Exception:</b> if your move captures opposing stones, it is allowed. Capturing creates new liberties.'],
  tasks:['One empty corner is forbidden for you, the other is not. Find the allowed move that captures.'],
  m:{a:'Correct. Without capturing, the point would be forbidden. Because you capture, it is allowed.',b:'That captures nothing. Look for the empty point where White itself has no air left.'}},
 ko:{title:'Ko',sum:'No immediate recapture',
  body:['Sometimes both players could endlessly take turns recapturing a single stone. The <b>ko rule</b> forbids this: after such a capture, the opponent may not recapture right away.','They must play elsewhere first, ideally a threat you have to answer. Only then may they recapture.'],
  tasks:['Capture the white stone in the middle.','White has just captured your stone with the marked stone. Try to recapture, then play elsewhere.'],
  m:{a:'Captured. White may not recapture right away, even though it looks possible. That is ko.',b:'The white stone in the middle has only one liberty. Where?',c:'Correct. After a move elsewhere you may take the ko again, unless White closes it first.'}},
 augen:{title:'Two eyes',sum:'When a group lives',
  body:['An <b>eye</b> is an empty point completely surrounded by your group. The opponent may not play there unless it captures.','If a group has <b>two separate eyes</b>, it can never be captured: the opponent would have to fill both at once. It lives forever.','With three empty points in a row, the middle one decides. Whoever takes it first decides life or death.'],
  tasks:['Your group in the bottom left is surrounded. Make two eyes.','Now the other way round: kill the white group.'],
  m:{a:'Two separate eyes. Your group lives; White can never capture it.',b:'Now only one eye is left. Try the middle point.',c:'If you do not react here, White plays in the middle and your group has only one eye.',d:'Hit. White can only make one eye now. The group is dead.',e:'White can now play in the middle and make two eyes. Take the key point.'}},
 zaehlen:{title:'End of game & counting',sum:'Passing, territory, komi',
  body:['The game ends when both players <b>pass</b> in a row because no move gains anything.','Counting works like this: your stones on the board plus all empty points surrounded only by your stones. Groups that can no longer live are removed first.','Captured stones do not count extra. They still earn points: they are missing from your opponent on the board, and their space becomes your territory.','Because Black moves first, White receives compensation called <b>komi</b>. In this app it is 7.5 points. The half point prevents a draw.'],
  tasks:['The border between the territories has a gap. Close it, or White will invade your territory.'],
  m:{a:'Border closed. Black: 7 stones + 21 empty points = 28. White: 7 stones + 14 points = 21.',b:'The gap is on the border between Black and White.'}},
 ecken:{title:'Corner, side, center',sum:'The first strategy',
  body:['In the corner, two edges help you enclose. For the same area you need far fewer stones there than in the center.','So in the opening: <b>corners first, then sides, the center last.</b>','The 1st and 2nd lines from the edge are too low at the start. The 3rd line secures territory, the 4th line gives more influence.'],
  tasks:['The 9×9 board is empty. Choose a good first move.'],
  m:{ok:l=>`Good opening move on the ${l===3?'3rd':'4th'} line. From here the corner is easy to enclose.`,low:'Too close to the edge. The 1st and 2nd lines make hardly any territory. Go to the 3rd or 4th line.',mid:'The center is hard to secure. Try a corner.',side:'The side is okay, but at the start the corner is worth more.'}},
 schneiden:{title:'Connecting & cutting',sum:'Spotting cutting points',
  body:['Connected stones are strong. Separate groups each have to survive on their own. Watch for <b>cutting points</b>: empty points where the opponent can separate your stones.','Rule of thumb: connect your own stones, cut your opponent’s.'],
  tasks:['White threatens to separate your two stones. Connect them.','Now the other way round: cut the white stones apart.'],
  m:{a:'Connected. At the same time you separate the white stones.',b:'Your stones are still separated. Where is the point between them?',c:'Cut. Remember: your opponent’s key point is often yours too.',d:'White can still connect. Take the point between the white stones.'}},
 plan:{title:'Your thinking plan',sum:'A checklist for every move',
  body:['Strong players ask themselves the same questions before every move. Go through them in this order:'],
  list:['Is one of my groups in atari? Then save it, or give it up on purpose if it can no longer be saved.','Can I capture something or put the opponent in atari?','Did the opponent’s last move threaten anything? Where do they want to go?','Are my groups connected? Are there dangerous cutting points?','Where is the largest open area? At the start: corners, then sides.','Never play inside your own eye.'],
  after:'In play mode, the coach comments on each of your moves. “Hint” points you to a strong idea, and “Undo” lets you try it out.'},
 form:{title:'Good shape',sum:'Empty triangle and tiger’s mouth',
  body:['Good stones do a lot with little effort. Three stones in an L with the fourth point empty are called an <b>empty triangle</b>. They have barely more liberties than two stones and cover little area. That is bad shape.','One example of good shape is the <b>tiger’s mouth</b>: three stones surround an empty point on three sides. If the opponent plays inside, that stone is in atari at once. This way you protect a cutting point without occupying it.'],
  tasks:['Extend your two stones without making an empty triangle.','White wants to push between your stones at D4. Protect the point with a tiger’s mouth.'],
  m:{a:'Good shape. A straight line has many liberties and works efficiently.',b:'That is an empty triangle: three stones, but barely more liberties than two. Extend straight instead.',c:'Stay in contact. Play right next to your stones.',
   d:'Tiger’s mouth. If White plays D4 now, that stone is in atari at once. And you block White from below.',e:'That connects too, but it is heavy. The tiger’s mouth protects D4 and blocks White at the same time.',f:'D4 is still unprotected. Play so that three of your stones surround D4.'}},
 leiter:{title:'The ladder',sum:'Capturing in a zigzag',
  body:['If a stone has only two liberties, you can often capture it with a <b>ladder</b>. You keep giving atari so that after each extension it has only two liberties again. The stones run across the board in a zigzag until the edge stops them.','The side matters: give atari so that the opponent has to run towards your stones.','If an opponent stone stands in the way, a <b>ladder breaker</b>, the stones escape. So check the diagonal first.'],
  tasks:['Capture the white stone marked ▲. White fights back. Keep giving atari until it is captured.'],
  m:{a:'Captured. The ladder ran all the way to the edge.',b:w=>`White escapes${w?' at '+w:''}. Give atari from the side where White is left with only two liberties.`,c:w=>`White extends to ${w}. Keep going: atari again.`,e:w=>`White plays ${w}. But the group is still in atari. Capture it.`}},
 seki:{title:'Seki',sum:'Living without two eyes',
  body:['Sometimes neither side can capture the other. Two groups share their last liberties, and whoever plays there first puts themselves in atari. This is called <b>seki</b>: both groups live, even without two eyes.','In seki the shared points stay empty. They count for nobody.'],
  tasks:['Bottom left, your two stones and the white group share the points B1 and B2. Play a stone without breaking the seki.'],
  m:{a:'Correct. You leave the seki alone. Both groups live, and B1 and B2 count for nobody.',b:'Now your group has only one liberty left. White captures and lives. In seki nobody plays inside first.'}},
 endspiel:{title:'Endgame',sum:'Closing borders',
  body:['Towards the end the territories are almost finished. Now it is about the last <b>borders</b>. A gap in your wall costs points: the opponent plays inside and shrinks your territory.','The order: first close gaps that cost points. Neutral points between the walls are called <b>dame</b>. They are worth nothing to anyone and come last.'],
  tasks:['There is a gap in your wall and a neutral point. Play the most valuable move.'],
  m:{a:'Exactly. C2 closes your border. Otherwise White plays there and takes points from you.',b:'D5 is neutral. It is worth nothing to anyone. Look for the gap in your wall.',c:'That blocks too, but costs you a point inside your own territory. Close the gap right in the wall.',d:'This move gains nothing. Look for the gap in your black wall.'}},
 tod:{title:'Life and death',sum:'Eye shapes and the vital point',
  body:['Whether a group lives depends on the shape of its inside space. Almost every shape has a <b>vital point</b>: whoever takes it first decides life or death.','Three points in a row or bent: the vital point is the middle or the bend. Four in a row live by themselves. Four as a square are dead. Four as a pyramid: the vital point is the centre.'],
  tasks:['Bottom left: your group has a bent space (A2, A1, B1). Make two eyes.','Now the other way round: White has a pyramid of four points. Kill the group.'],
  m:{a:'Alive. A2 and B1 are now two separate eyes. White cannot play in either.',b:'That leaves only a two-point space, which is one eye. The vital point is the bend in the corner.',c:'Now White plays A1 and your group has only one eye. Take the bend yourself.',
   d:'Killed. After C1, White can only make one eye. The group is dead.',e:'Now White plays C1 and gets two eyes. The vital point is the centre of the pyramid.',f:'You cannot kill the group from outside. Play inside its space, on the vital point.'}},
 kokampf:{title:'Ko fight',sum:'Threaten, then retake',
  body:['In a ko you may not retake at once. First you need a <b>ko threat</b>: a move elsewhere that the opponent has to answer. If they answer, you may retake the ko.','Good threats are ataris on groups whose loss would hurt. Whoever has more threats wins the ko.'],
  tasks:['White has just taken the ko at D4. E4 is forbidden for you. Play a ko threat.','White connected at G5. The ko is open again. Retake it.'],
  m:{a:'Strong threat: two white stones are in atari. White has to answer.',b:'White does not need to answer that. A threat puts a group in atari. Look at the top right.',c:'Ko retaken. Now White needs a threat.',d:'Capture the stone at D4 back. Play E4.'}},
 eroeffnung:{title:'Opening',sum:'Corners, then sides',
  body:['In the opening both players spread their stones across the board. The order is almost always the same: first the <b>corners</b>, then the <b>sides</b>, the centre last.','Territory forms between your stones on a side. Between your stone and an opponent stone, the point is valuable for both.'],
  tasks:['Black has C3, White has G7. Take a free corner.','All corners are taken. Where is the biggest move now?'],
  m:{a:'Correct. Another corner is the biggest move.',b:'This corner is already taken. Find a free one.',c:'Too close to the edge. The 1st and 2nd lines make hardly any territory.',d:'Corners first. Two are still free.',
   e:'Good. You connect your two corners and build territory on the left side.',f:'Bold: you jump in between the white corners. That bothers White, but your stones there are alone.',g:'Very good. The point between you and White matters to both.',h:'The centre is too open. Sides first.',i:'That is too close to a corner that is already taken. The middle of a side is bigger.'}},
 opfern:{title:'Sacrificing stones',sum:'Not every stone needs saving',
  body:['Not every stone is worth saving. A single stone deep in the opponent’s area is often lost. If you keep running with it, you hand the opponent free moves and they capture it anyway.','Before saving, ask yourself: is the stone important? Can it escape at all? If not, play the biggest move elsewhere.'],
  tasks:['Your stone at H2 is in atari, deep in White’s area. A corner is still free at the top right. What do you play?'],
  m:{a:'Correct. The free corner is worth much more than a stone that cannot escape.',b:'After H1 your group has two liberties on the edge. White captures it anyway. Sacrifice the stone and take the corner.',c:'That is small. A whole corner is still free at the top right.'}}
},
nl:{
 brett:{title:'Het bord',sum:'Snijpunten, beurten, doel',
  body:['Go speel je op de <b>snijpunten</b> van de lijnen, niet in de vakjes. Profs gebruiken een bord van 19×19. Om te leren is 9×9 of kleiner ideaal.','Zwart begint, daarna zetten beide spelers om de beurt één steen. Geplaatste stenen worden nooit verschoven.','Het doel: aan het einde heb je meer van het bord omsloten dan je tegenstander.'],
  tasks:['Zet een steen op het gemarkeerde punt. Het midden van het bord heet tengen.'],
  m:{a:'Precies. Elke steen staat op een snijpunt.',b:'Geldig punt, maar niet het gemarkeerde. Probeer het nog eens.'}},
 freiheiten:{title:'Vrijheden',sum:'Hoeveel lucht een steen heeft',
  body:['Elke steen heeft lucht nodig. De lege punten direct ernaast (boven, onder, links, rechts) heten <b>vrijheden</b>. Diagonale punten tellen niet.','In het midden heeft een steen 4 vrijheden, aan de rand 3, in de hoek maar 2. De blauwe punten laten ze zien.'],
  tasks:['Neem de witte steen een vrijheid af door er direct naast te zetten.','Deze steen staat in de hoek en heeft maar 2 vrijheden. Neem er één van af.'],
  m:{a:'Goed. Hij heeft nu nog maar 3 vrijheden.',b:'Diagonaal of verder weg neemt geen vrijheid af. Zet direct op een blauw punt.',c:'Precies. Nu heeft hij nog maar één vrijheid. Je zegt: hij staat in atari.',d:'Zet direct naast de steen in de hoek.'}},
 schlagen:{title:'Slaan',sum:'De laatste vrijheid afnemen',
  body:['Neem je een steen zijn <b>laatste</b> vrijheid af, dan is hij geslagen. Hij gaat van het bord en telt als gevangene.','Heeft een steen nog maar één vrijheid, dan staat hij in <b>atari</b>. Dat is de belangrijkste waarschuwing in het hele spel. In de speelmodus markeert een rode ring zulke stenen.'],
  tasks:['De witte steen staat in atari. Sla hem.','Ook aan de rand: sla de witte steen.'],
  m:{a:'Geslagen! De steen is weg en telt voor jou.',b:'De witte steen heeft nog een vrijheid. Zoek het lege punt direct ernaast.',c:'Goed. Aan de rand heb je minder stenen nodig om te slaan.',d:'Aan de rand ontbreekt de onderkant. Welke vrijheid heeft hij nog?'}},
 gruppen:{title:'Groepen',sum:'Verbonden stenen delen vrijheden',
  body:['Stenen van dezelfde kleur die horizontaal of verticaal naast elkaar liggen, vormen een <b>groep</b>. Ze delen hun vrijheden en worden alleen samen geslagen.','Diagonaal liggende stenen zijn niet verbonden. Grotere groepen zijn meestal moeilijker te vangen, omdat ze meer vrijheden hebben.'],
  tasks:['De twee witte stenen zijn één groep met maar één vrijheid. Sla ze allebei.'],
  m:{a:'Allebei in één keer geslagen. Zo werken groepen.',b:'Zoek de laatste gezamenlijke vrijheid van de twee witte stenen.'}},
 retten:{title:'Atari: redden',sum:'Verlengen of terugslaan',
  body:['Staat een van je groepen in atari, dan moet je meestal meteen reageren. Er zijn twee manieren:','<b>Verlengen:</b> zet aan je groep, zodat hij nieuwe vrijheden krijgt. <b>Terugslaan:</b> sla een aanvallende steen die zelf in atari staat.'],
  tasks:['Je steen staat in atari. Red hem door te verlengen.','Weer atari. Deze keer helpt verlengen niet. Vind de redding.'],
  m:{a:'Gered. Je groep heeft nu 3 vrijheden.',b:'Je steen staat nog steeds in atari. Waar krijgt hij nieuwe vrijheden?',c:'Sterk. Je slaat de aanvaller en je steen krijgt nieuwe lucht.',d:'Kijk naar de witte steen onder de jouwe. Hoeveel vrijheden heeft hij?'}},
 verboten:{title:'Verboden punten',sum:'Zelfmoord en de uitzondering',
  body:['Je mag geen steen zetten waar hij (samen met zijn groep) meteen geen vrijheid zou hebben. Dat is <b>zelfmoord</b>.','<b>Uitzondering:</b> slaat je zet daarbij stenen van de tegenstander, dan mag het wel. Door het slaan ontstaan nieuwe vrijheden.'],
  tasks:['Eén lege hoek is voor jou verboden, de andere niet. Vind de toegestane zet die slaat.'],
  m:{a:'Goed. Zonder te slaan was het punt verboden. Omdat je slaat, mag het.',b:'Dat slaat niets. Zoek het lege punt waar Wit zelf geen lucht meer heeft.'}},
 ko:{title:'Ko',sum:'Niet meteen terugslaan',
  body:['Soms zouden beide spelers eindeloos om de beurt één steen kunnen terugslaan. De <b>ko-regel</b> verbiedt dat: na zo’n slag mag de tegenstander niet meteen terugslaan.','Hij moet eerst ergens anders spelen, het liefst een dreiging waarop jij moet antwoorden. Pas daarna mag hij terugslaan.'],
  tasks:['Sla de witte steen in het midden.','Wit heeft net met de gemarkeerde steen jouw steen geslagen. Probeer terug te slaan en speel daarna ergens anders.'],
  m:{a:'Geslagen. Wit mag nu niet meteen terugslaan, ook al lijkt het zo. Dat is ko.',b:'De witte steen in het midden heeft maar één vrijheid. Waar?',c:'Goed. Na een zet elders mag je de ko weer slaan, als Wit hem niet eerst dichtmaakt.'}},
 augen:{title:'Twee ogen',sum:'Wanneer een groep leeft',
  body:['Een <b>oog</b> is een leeg punt dat helemaal door je groep is omsloten. De tegenstander mag daar niet zetten, tenzij hij daarmee slaat.','Heeft een groep <b>twee gescheiden ogen</b>, dan kan hij nooit geslagen worden: de tegenstander zou beide tegelijk moeten vullen. Hij leeft voor altijd.','Bij drie lege punten op een rij beslist het middelste. Wie het eerst bezet, beslist over leven of dood.'],
  tasks:['Je groep linksonder is ingesloten. Zorg voor twee ogen.','Nu andersom: dood de witte groep.'],
  m:{a:'Twee gescheiden ogen. Je groep leeft, Wit kan hem nooit slaan.',b:'Nu blijft er maar één oog over. Probeer het middelste punt.',c:'Als je hier niet reageert, zet Wit in het midden en heeft je groep nog maar één oog.',d:'Raak. Wit kan nog maar één oog maken. De groep is dood.',e:'Wit kan nu in het midden zetten en twee ogen maken. Neem het sleutelpunt.'}},
 zaehlen:{title:'Einde & tellen',sum:'Passen, gebied, komi',
  body:['De partij eindigt als beide spelers na elkaar <b>passen</b>, omdat geen zet nog iets oplevert.','Zo wordt geteld: je stenen op het bord plus alle lege punten die alleen door jouw stenen worden omsloten. Groepen die niet meer kunnen leven, worden eerst verwijderd.','Geslagen stenen tellen niet extra. Ze leveren toch punten op: ze ontbreken bij de tegenstander op het bord, en hun plek wordt jouw gebied.','Omdat Zwart begint, krijgt Wit een compensatie, de <b>komi</b>. In deze app is dat 7,5 punten. Het halve punt voorkomt gelijkspel.'],
  tasks:['De grens tussen de gebieden heeft een gat. Sluit het, anders dringt Wit je gebied binnen.'],
  m:{a:'Grens dicht. Zwart: 7 stenen + 21 lege punten = 28. Wit: 7 stenen + 14 punten = 21.',b:'Het gat ligt op de grens tussen Zwart en Wit.'}},
 ecken:{title:'Hoek, zijkant, midden',sum:'De eerste strategie',
  body:['In de hoek helpen twee randen je bij het omsluiten. Voor hetzelfde gebied heb je daar veel minder stenen nodig dan in het midden.','Daarom geldt in de opening: <b>eerst hoeken, dan zijkanten, als laatste het midden.</b>','De 1e en 2e lijn vanaf de rand zijn in het begin te laag. De 3e lijn verzekert gebied, de 4e lijn geeft meer invloed.'],
  tasks:['Het 9×9-bord is leeg. Kies een goede eerste zet.'],
  m:{ok:l=>`Goede openingszet op de ${l}e lijn. Vanaf hier kun je de hoek goed omsluiten.`,low:'Te dicht bij de rand. Op de 1e en 2e lijn ontstaat nauwelijks gebied. Ga naar de 3e of 4e lijn.',mid:'Het midden is moeilijk vast te houden. Probeer een hoek.',side:'De zijkant is oké, maar in het begin is de hoek meer waard.'}},
 schneiden:{title:'Verbinden & snijden',sum:'Snijpunten herkennen',
  body:['Verbonden stenen zijn sterk. Gescheiden groepen moeten elk apart overleven. Let op <b>snijpunten</b>: lege punten waar de tegenstander je stenen kan scheiden.','Vuistregel: verbind je eigen stenen, snijd die van de tegenstander.'],
  tasks:['Wit dreigt je twee stenen te scheiden. Verbind ze.','Nu andersom: snijd de witte stenen van elkaar.'],
  m:{a:'Verbonden. Tegelijk scheid je de witte stenen.',b:'Je stenen zijn nog gescheiden. Waar ligt het punt ertussen?',c:'Gesneden. Onthoud: het belangrijke punt van de tegenstander is vaak ook het jouwe.',d:'Wit kan zich nog verbinden. Neem het punt tussen de witte stenen.'}},
 plan:{title:'Je denkplan',sum:'Checklist voor elke zet',
  body:['Sterke spelers stellen zich voor elke zet dezelfde vragen. Loop ze in deze volgorde door:'],
  list:['Staat een van mijn groepen in atari? Dan redden, of bewust opgeven als hij niet meer te redden is.','Kan ik iets slaan of de tegenstander in atari zetten?','Heeft de laatste zet van de tegenstander iets bedreigd? Waar wil hij heen?','Zijn mijn groepen verbonden? Zijn er gevaarlijke snijpunten?','Waar is het grootste vrije gebied? In het begin: hoeken, dan zijkanten.','Zet nooit in je eigen oog.'],
  after:'In de speelmodus geeft de trainer commentaar op elke zet. Met „Tip” wijst hij je een sterk idee aan, met „Terug” kun je het uitproberen.'},
 form:{title:'Goede vorm',sum:'Lege driehoek en tijgerbek',
  body:['Goede stenen bereiken veel met weinig moeite. Drie stenen in een hoek, waarbij het vierde punt leeg blijft, heten een <b>lege driehoek</b>. Ze hebben nauwelijks meer vrijheden dan twee stenen en bestrijken weinig gebied. Dat is slechte vorm.','Goede vorm is bijvoorbeeld de <b>tijgerbek</b>: drie stenen omringen een leeg punt van drie kanten. Zet de tegenstander erin, dan staat die steen meteen in atari. Zo bescherm je een snijpunt zonder het zelf te bezetten.'],
  tasks:['Verleng je twee stenen zonder een lege driehoek te vormen.','Wit wil bij D4 tussen je stenen drukken. Bescherm het punt met een tijgerbek.'],
  m:{a:'Goede vorm. Een rechte lijn heeft veel vrijheden en werkt efficiënt.',b:'Dat is een lege driehoek: drie stenen, maar nauwelijks meer vrijheden dan twee. Verleng liever recht.',c:'Blijf in contact. Zet direct naast je stenen.',
   d:'Tijgerbek. Zet wit nu op D4, dan staat die steen meteen in atari. En je blokkeert wit van onderen.',e:'Dat verbindt ook, maar is zwaar. De tijgerbek beschermt D4 en blokkeert wit tegelijk.',f:'D4 is zo nog onbeschermd. Zet zo dat drie van je stenen D4 omringen.'}},
 leiter:{title:'De ladder',sum:'Vangen in een zigzag',
  body:['Heeft een steen maar twee vrijheden, dan kun je hem vaak vangen met een <b>ladder</b>. Je geeft steeds opnieuw atari, zodat hij na elke verlenging weer maar twee vrijheden heeft. De stenen lopen zigzaggend over het bord tot de rand ze stopt.','De kant is belangrijk: geef atari zo dat de tegenstander naar jouw stenen toe moet lopen.','Staat er een steen van de tegenstander in de weg, een <b>ladderbreker</b>, dan ontsnapt hij. Controleer daarom eerst de diagonaal.'],
  tasks:['Vang de witte steen met ▲. Wit verweert zich. Geef atari tot hij geslagen is.'],
  m:{a:'Gevangen. De ladder liep door tot de rand.',b:w=>`Wit ontsnapt${w?' bij '+w:''}. Geef atari vanaf de kant waar wit daarna maar twee vrijheden heeft.`,c:w=>`Wit verlengt naar ${w}. Door: weer atari.`,e:w=>`Wit speelt ${w}. Maar de groep staat nog in atari. Sla hem.`}},
 seki:{title:'Seki',sum:'Leven zonder twee ogen',
  body:['Soms kan geen van beide de ander vangen. Twee groepen delen hun laatste vrijheden, en wie er als eerste in zet, zet zichzelf in atari. Dat heet <b>seki</b>: beide groepen leven, ook zonder twee ogen.','In seki blijven de gedeelde punten leeg. Ze tellen voor niemand.'],
  tasks:['Linksonder delen je twee stenen en de witte groep de punten B1 en B2. Zet een steen zonder de seki te breken.'],
  m:{a:'Juist. Je laat de seki met rust. Beide groepen leven, B1 en B2 tellen voor niemand.',b:'Nu heeft je groep nog maar één vrijheid. Wit slaat en leeft. In seki zet niemand er als eerste in.'}},
 endspiel:{title:'Eindspel',sum:'Grenzen sluiten',
  body:['Tegen het einde zijn de gebieden bijna klaar. Nu gaat het om de laatste <b>grenzen</b>. Een gat in je muur kost punten: de tegenstander zet erin en verkleint je gebied.','De volgorde: eerst gaten sluiten die punten kosten. Neutrale punten tussen de muren heten <b>dame</b>. Ze leveren niemand iets op en komen als laatste.'],
  tasks:['Er is een gat in je muur en een neutraal punt. Speel de waardevolste zet.'],
  m:{a:'Precies. C2 sluit je grens. Anders zet wit daar en neemt je punten af.',b:'D5 is neutraal. Het levert niemand iets op. Zoek het gat in je muur.',c:'Dat blokkeert ook, maar kost je een punt in je eigen gebied. Sluit het gat direct in de muur.',d:'Deze zet levert niets op. Zoek het gat in je zwarte muur.'}},
 tod:{title:'Leven en dood',sum:'Oogvormen en het sleutelpunt',
  body:['Of een groep leeft, hangt af van de vorm van haar binnenruimte. Bijna elke vorm heeft een <b>sleutelpunt</b>: wie het als eerste bezet, beslist over leven en dood.','Drie punten op een rij of in een hoek: het sleutelpunt is het midden of de knik. Vier op een rij leven vanzelf. Vier als vierkant zijn dood. Vier als piramide: het sleutelpunt is het midden.'],
  tasks:['Linksonder: je groep heeft een gebogen ruimte (A2, A1, B1). Maak twee ogen.','Nu andersom: wit heeft een piramide van vier punten. Dood de groep.'],
  m:{a:'Leeft. A2 en B1 zijn nu twee aparte ogen. Wit kan in geen van beide zetten.',b:'Dan blijft er maar een ruimte van twee punten over, dus één oog. Het sleutelpunt is de knik in de hoek.',c:'Nu zet wit op A1 en heeft je groep nog maar één oog. Bezet de knik zelf.',
   d:'Gedood. Na C1 kan wit nog maar één oog maken. De groep is dood.',e:'Nu zet wit op C1 en krijgt twee ogen. Het sleutelpunt is het midden van de piramide.',f:'Van buitenaf dood je de groep niet. Zet in haar binnenruimte, op het sleutelpunt.'}},
 kokampf:{title:'Ko-gevecht',sum:'Dreigen, dan terugslaan',
  body:['Bij ko mag je niet meteen terugslaan. Eerst heb je een <b>ko-dreiging</b> nodig: een zet elders waarop de tegenstander moet antwoorden. Antwoordt hij, dan mag je de ko terugnemen.','Goede dreigingen zijn atari’s op groepen waarvan het verlies pijn doet. Wie meer dreigingen heeft, wint de ko.'],
  tasks:['Wit heeft net de ko op D4 genomen. E4 is voor jou verboden. Speel een ko-dreiging.','Wit heeft op G5 verbonden. De ko is weer vrij. Neem hem terug.'],
  m:{a:'Sterke dreiging: twee witte stenen staan in atari. Wit moet antwoorden.',b:'Daarop hoeft wit niet te antwoorden. Een dreiging zet een groep in atari. Kijk rechtsboven.',c:'Ko teruggenomen. Nu heeft wit een dreiging nodig.',d:'Sla de steen op D4 terug. Speel E4.'}},
 eroeffnung:{title:'Opening',sum:'Hoeken, dan zijkanten',
