  const p=v=>String(v).padStart(2,'0');return`${p(s/3600|0)}:${p((s/60|0)%60)}:${p(s%60)}`}
function shareText(){const no=dayNo(),r=dst().res[no];
  return`Go-Schule · ${T('daily_title')} ${T('daily_no',no)}\n${r==='ok'?'● '+T('share_ok'):'○ '+T('share_x')} · ${T('streak',dstreak())}\nhttps://bcakebreakfast.github.io/go-schule/`}
function shareDaily(btn){const txt=shareText();
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});return}
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent=T('copied');setTimeout(()=>{btn.textContent=o},1800)}};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>{});else{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();done()}}
let dailyDay=0;
function renderDaily(){const no=dayNo(),s=dst(),r=s.res[no],id=DCATS[no%DCATS.length],stk=dstreak();dailyDay=no;
  const st=r?`<span class="${r==='ok'?'acc':''}">${r==='ok'?'●':'○'} ${T(r==='ok'?'daily_ok':'daily_x')}</span> · `:'';
  $('#daily').innerHTML=`<span class="eyebrow daily-eb">${T('daily_title')} · ${T('daily_no',no)}</span><span class="tglyph">${glyph(id)}</span><span class="lt"><span class="t">${TC(id).title}${stk?` · ${T('streak',stk)}`:''}</span><span class="d">${r?st+`<span id="daily-cd">${T('daily_next',untilMidnight())}</span>`:T('daily_once')}</span></span>`+
    (r?`<button class="btn" id="daily-share">${T('share')}</button>`:`<button class="btn primary" id="daily-go">${T('daily_solve')}</button>`);
  const g=$('#daily-go');if(g)g.onclick=openDaily;const sh=$('#daily-share');if(sh)sh.onclick=e=>{e.stopPropagation();shareDaily(sh)}}
setInterval(()=>{if($('#view-train').hidden)return;if(dayNo()!==dailyDay){renderDaily();return}const c=$('#daily-cd');if(c)c.textContent=T('daily_next',untilMidnight())},1000);
function openDaily(){const no=dayNo(),{id,p}=dailyPuzzle(no);D={cat:id,daily:no};newDrill(p);if(dst().res[no])D.counted=true;show('drill')}
function renderTrain(){let tot=0,best=0;TCATS.forEach(c=>{const s=tstat(c.id);tot+=s.ok;best=Math.max(best,s.best)});
  $('#ts-solved').textContent=tot;$('#ts-best').textContent=best;$('#ts-rank').textContent=rankName(rk().r,true);renderDaily();
  const fresh=TCATS.every(c=>!tstat(c.id).tries)&&!rk().g;$('#ts-empty').hidden=!fresh;$('#ts-stats').hidden=fresh;
  $('#train-list').innerHTML=TCATS.map(c=>{const s=tstat(c.id);
    const chip=s.streak>1?`<span class="chip hot">${T('streak',s.streak)}</span>`:(s.ok?`<span class="chip">${T('solved_n',s.ok)}</span>`:`<span class="chip">${c.set?T('tasks_n',TSET[c.set].length):T('endless')}</span>`);
    return`<button class="train-row" data-id="${c.id}"><span class="tglyph">${glyph(c.id)}</span><span class="lt"><span class="t">${c.title}</span><span class="d">${c.sum}</span></span>${chip}</button>`}).join('');
  document.querySelectorAll('.train-row').forEach(b=>b.onclick=()=>openDrill(b.dataset.id))}
$('#ts-start').onclick=()=>openDrill('schlagen');
function openDrill(id){D={cat:id};newDrill();show('drill')}
function newDrill(pp){if(D.daily&&!pp){const q=dailyPuzzle(D.daily);pp=q.p}
  stillBoard('#dr-board');const c=TC(D.cat);const p=pp||(c.set?fromSet(c.set):c.gen());
  if(!p){D.msg=T('nodrill');D.state='';D.sub='';renderDrill();return}
  Object.assign(D,{quiz:null,answered:-1},p,{start:p.b.slice(),ans:new Set(p.ans),phase:'play',fails:0,shown:false,first:true,last:-1,marks:[],counted:false,whyOpen:false,msg:p.quiz?p.quiz.q:c.goal,state:'',sub:p.quiz?p.quiz.note:''});
  renderDrill()}
function resetDrill(){stillBoard('#dr-board');Object.assign(D,{b:D.start.slice(),phase:'play',first:true,last:-1,marks:D.shown?D.marks:[],msg:TC(D.cat).goal,state:'',sub:'',whyOpen:false});renderDrill()}
function drillSolved(msg){const s=tstat(D.cat);D.phase='solved';D.state='ok';
  if(!D.counted){D.counted=true;
    if(D.daily)dailyRecord(!D.fails&&!D.shown);
    else{s.tries++;if(!D.fails&&!D.shown){s.ok++;s.streak++;s.best=Math.max(s.best,s.streak);rankAdj(3,300)}}}
  D.msg=msg;D.sub=TC(D.cat).tip;save();renderDrill()}
function drillFailed(msg){const s=tstat(D.cat);D.phase='failed';D.state='bad';D.fails++;
  if(!D.counted){D.counted=true;if(D.daily)dailyRecord(false);else{s.tries++;s.streak=0;rankAdj(-1)}}D.msg=msg;D.sub='';save();renderDrill()}
function drillAnswer(k){if(!D.quiz||D.phase!=='play')return;const o=D.quiz.opts[k];D.answered=k;
  if(o.ok)drillSolved(D.quiz.right);else drillFailed(D.quiz.wrong);D.sub=D.quiz.detail;renderDrill()}
function drillMove(i){if(!D||D.phase!=='play'||D.quiz)return;const n=D.n,c=D.cat;
  const r=tryPlay(D.b,i,1,n,-1);if(r.err){D.msg=ERR[r.err==='ko'?'occupied':r.err];D.state='bad';D.sub='';renderDrill();return}
  buzz(r.captured.length>0);playStone('me',r.captured.length);const k=r.captured.length,before=D.b;D.b=r.board;D.last=i;
  if(c==='schlagen'){
    if(D.ans.has(i))return drillSolved(T('you_cap',k));
    return drillFailed(k?T('d_only',k):T('d_none'))}
  if(c==='doppel'){
    if(D.ans.has(i))return drillSolved(T('d_double_ok'));
    let at=0;const seen=new Set();for(const j of nbrs(i,n))if(r.board[j]===2&&!seen.has(j)){const g=groupAt(r.board,j,n);g.stones.forEach(s=>seen.add(s));if(g.libs.size===1)at++}
    return drillFailed(at===1?T('d_single'):(r.group.libs.size<2?T('d_selfatari'):T('d_nothreat')))}
  if(c==='punkte'){
    if(D.ans.has(i))return drillSolved(T('d_corner_ok'));
    const x=i%n,y=(i/n)|0,d=Math.min(x,y,n-1-x,n-1-y);
    const hx=x<=5?0:x>=n-6?1:-1,hy=y<=5?0:y>=n-6?2:-1,cornerOf=(hx>=0&&hy>=0)?(hx|hy):-1;
    return drillFailed(d<=1?T('d_low'):(cornerOf>=0&&!D.emptyCorners.includes(cornerOf)?T('d_taken'):T('d_side')))}
  if(c==='retten'){
    if(D.ans.has(i)){const L=groupAt(D.b,D.t,n).libs.size;return drillSolved(k?T('d_saved_cap',L):T('d_saved',L))}
    const km=D.b[D.t]?rdKillMove(D.b,D.t,n,2):-1;
    if(km>=0){const rk=tryPlay(D.b,km,2,n,-1);D.b=rk.board;D.last=km;setTimeout(()=>playStone('ai',rk.captured.length),260)}
    return drillFailed(km>=0?(D.b[D.t]?T('d_lost',coord(km,n)):T('d_lost_cap',coord(km,n))):T('d_not_saved'))}
  // Fangen / Leiter: Weiß wehrt sich
  const t=D.t;if(!D.b[t])return drillSolved(T('d_caught',coord(i,n)));
  const okMove=D.first?D.ans.has(i):(RD.nodes=0,!rdLive(D.b,t,n,1,24));
  D.first=false;
  const w=rdReply(D.b,t,n,1);if(w>=0){const rw=tryPlay(D.b,w,2,n,-1);D.b=rw.board;D.last=w;setTimeout(()=>playStone('ai',rw.captured.length),260)}
  if(!okMove)return drillFailed(T('d_escape',w>=0?coord(w,n):''));
  if(w<0)D.msg=T('d_gives_up');
  else D.msg=T('d_continue',coord(w,n));
  D.state='';D.sub='';renderDrill()}
function renderDrill(){const c=TC(D.cat),s=tstat(D.cat);
  $('#dr-cat').textContent=D.daily?T('daily_title'):T('train_title');
  $('#dr-turn').textContent=D.daily?c.title+' · '+T('daily_no',D.daily):c.title;
  if(D.daily){const k=dstreak();$('#dr-streak').textContent=T('streak',k);$('#dr-streak').className='chip'+(k>1?' hot':'')}
  else{$('#dr-streak').textContent=T('drill_chip',s.streak,s.ok);$('#dr-streak').className='chip'+(s.streak>1?' hot':'')}
  if(D.b){const tri=(D.t>=0&&(c.set)&&D.b[D.t])?groupAt(D.b,D.t,D.n).stones:[];
    const done=D.quiz&&D.phase!=='play';
    drawBoard($('#dr-board'),{n:D.n,board:D.b,last:D.last,hint:-1,marks:D.marks,tri,ghost:D.phase==='play'&&!D.quiz,onPlay:drillMove,dead:done?D.quiz.dead:[],own:done?D.quiz.own:null})}
  const ch=$('#dr-choices'),ctr=$('#dr-controls'),nb=$('#dr-nextbar');
  const asking=!!(D.quiz&&D.phase==='play'),finished=D.phase==='solved'||(D.quiz&&D.phase!=='play');
  ch.hidden=!asking;nb.hidden=!finished;ctr.hidden=asking||finished;nb.textContent=D.daily?T('share'):T('next');$('#dr-next').disabled=!!D.daily;
  if(asking){ch.innerHTML=D.quiz.opts.map((o,k)=>`<button class="ctl" data-k="${k}">${o.txt}</button>`).join('');ch.querySelectorAll('button').forEach(b=>b.onclick=()=>drillAnswer(+b.dataset.k))}
  const fb=$('#dr-fb'),open=!!(D.quiz||D.whyOpen);fb.dataset.state=D.state||'';fb.classList.toggle('open',open);
  fb.innerHTML=`<span class="fb-text"><span class="fb-main">${fbHTML(D.state,D.msg||'')}</span>${D.sub&&open?`<small>${D.sub}</small>`:''}</span>`+(D.sub&&!open?`<button class="why" id="dr-why">${T('why')}</button>`:'');
  const why=$('#dr-why');if(why)why.onclick=()=>{D.whyOpen=true;renderDrill()};
  $('#dr-show').disabled=!D.b||!!D.quiz;$('#dr-retry').disabled=!D.b||!!D.quiz}
$('#dr-back').onclick=()=>{if(D)D.daily=0;show('train')};
$('#dr-next').onclick=()=>newDrill();
$('#dr-nextbar').onclick=e=>{if(D.daily)shareDaily(e.currentTarget);else newDrill()};
$('#dr-retry').onclick=()=>resetDrill();
$('#dr-show').onclick=()=>{if(!D.b)return;D.shown=true;D.marks=[...D.ans].map(i=>[i%D.n,(i/D.n)|0]);
  Object.assign(D,{b:D.start.slice(),phase:'play',first:true,last:-1,state:'',sub:'',
    msg:T('d_marked',D.ans.size)});renderDrill()};

/* ---------- Navigation ---------- */
function show(v){['learn','lesson','train','drill','play'].forEach(k=>$('#view-'+k).hidden=k!==v);
  document.documentElement.classList.toggle('fit',v==='play'||v==='drill');
  if(v==='lesson')renderLesson();
  const tab=v==='play'?'play':(v==='train'||v==='drill')?'train':'learn';
  ['learn','train','play'].forEach(k=>$('#tab-'+k).setAttribute('aria-selected',String(k===tab)));
  store.tab=tab;save();window.scrollTo(0,0);
  if(v==='learn')renderLearn();if(v==='train')renderTrain();
  if(v==='play'){renderPlay();if(G.phase==='play'&&G.turn===A()&&!busy)aiMove()}}
function setLang(l){if(!['de','en','nl'].includes(l))return;LANG=l;store.settings.lang=l;save();applyI18n();
  if(D&&D.phase==='play'&&!D.state&&!D.quiz)D.msg=TC(D.cat).goal;
  const v=['learn','lesson','train','drill','play'].find(k=>!$('#view-'+k).hidden);
  if(v==='learn')renderLearn();else if(v==='lesson')renderLesson();else if(v==='train')renderTrain();else if(v==='drill')renderDrill();
  if(G)renderPlay()}
document.querySelectorAll('.lang-seg button').forEach(b=>b.onclick=()=>setLang(b.dataset.v));
applyI18n();
$('#tab-learn').onclick=()=>show('learn');$('#tab-play').onclick=()=>show('play');$('#tab-train').onclick=()=>show('train');
show(store.tab==='play'?'play':store.tab==='train'?'train':'learn');
if('serviceWorker'in navigator&&window.GO_PWA){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
